  <!-- Wordmark -->
  <text x="60" y="35" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">Manthan360</text>
  <text x="61" y="47" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#a855f7" letter-spacing="1.5">LEARN BEYOND NOTES</text>
